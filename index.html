<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DR.NORA Appartment</title>
<meta name="description" content="Shared photos, videos and links for each part of the apartment.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>

:root{
  --bg:#f1f0ec; --surface:#ffffff; --ink:#1b1d22; --muted:#626672; --line:#dcdad3;
  --accent:#2b6f63; --accent-ink:#ffffff; --accent-soft:#dcebe7; --danger:#bf3a2c; --ok:#21804a;
  --display:"Bricolage Grotesque","Inter",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121514; --surface:#1b201f; --ink:#e9ece9; --muted:#9aa4a0; --line:#2c3331;
  --accent:#6cc3b1; --accent-ink:#0b1513; --accent-soft:#1d3330; --danger:#ff7d6e; --ok:#63d395; color-scheme:dark}}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-text-size-adjust:100%}
.wrap{max-width:1120px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 18px) max(16px,env(safe-area-inset-right,0px)) 70px max(16px,env(safe-area-inset-left,0px))}

header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font:800 clamp(28px,6.5vw,46px)/1 var(--display);margin:0;letter-spacing:-.02em}
.sub{color:var(--muted);margin:6px 0 0}
.owner{background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 12px;font:500 13px var(--body);cursor:pointer}
.owner.on{border-color:var(--accent);color:var(--accent)}

/* departments */
.depts{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;padding:16px 0 4px}
.dept{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 6px 10px;font:500 12.5px/1.25 var(--body);cursor:pointer;text-align:center;min-height:92px}
.dept svg{width:28px;height:28px;flex:none;stroke:var(--accent)}
.dept .c{position:absolute;top:6px;right:8px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.dept[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dept[aria-pressed="true"] svg{stroke:var(--accent-ink)}
.dept[aria-pressed="true"] .c{color:var(--accent-ink);opacity:.85}
.dept:hover{border-color:var(--accent)}
@media (max-width:420px){.depts{grid-template-columns:repeat(3,1fr)}.dept{min-height:86px;font-size:12px}}

/* add panel */
.add{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px;box-shadow:0 8px 22px -16px rgba(20,40,35,.45)}
.where{font-size:14px;color:var(--muted);text-align:center}
.where b{color:var(--ink)}
input[type=text],input[type=url]{font:16px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;min-height:46px;padding:0 12px;min-width:0}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;border:0;border-radius:12px;font:600 16px var(--body);cursor:pointer;padding:8px 12px}
.big svg{width:22px;height:22px;flex:none}
.big.p{background:var(--accent);color:var(--accent-ink)}
.big.s{background:var(--accent-soft);color:var(--ink)}
.big:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.linkform{display:grid;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row input{flex:1 1 220px}
.row button{min-height:46px;padding:0 22px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:600 15px var(--body);cursor:pointer}
.hint{margin:0;text-align:center;color:var(--muted);font-size:12.5px}
.queue{display:grid;gap:6px}
.qi{display:flex;align-items:center;gap:10px;font-size:13px;background:var(--bg);border-radius:8px;padding:6px 10px}
.qi .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qi .s{color:var(--muted)} .qi.ok .s{color:var(--ok)} .qi.err .s{color:var(--danger)}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.notice{border-radius:10px;padding:10px 12px;font-size:14px;background:var(--accent-soft)}
.notice.bad{background:transparent;border:1px solid var(--danger)}

/* type filter */
.types{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.type{border:0;background:none;color:var(--muted);font:500 14px var(--body);padding:6px 10px;border-radius:8px;cursor:pointer}
.type[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* wall */
.wall{columns:3 270px;column-gap:14px}
.item{break-inside:avoid;margin:0 0 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.media{display:block;width:100%;border:0;padding:0;background:var(--line);cursor:zoom-in;position:relative}
.media img,.media video{display:block;width:100%;height:auto;max-height:540px;object-fit:cover}
.play{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.play span{width:54px;height:54px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center}
.play svg{width:22px;height:22px;fill:#fff;margin-left:3px}
.missing{padding:26px 14px;text-align:center;color:var(--muted);font-size:13px}
.linkbox{display:flex;gap:12px;align-items:center;padding:14px;color:var(--ink);text-decoration:none;min-width:0}
.fav{flex:none;width:44px;height:44px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:800 20px var(--display);text-transform:uppercase}
.lt{min-width:0}
.ld{font-weight:600;overflow-wrap:anywhere}
.lu{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{border-top:1px solid var(--line);padding:10px 14px 12px;display:grid;gap:4px}
.note{white-space:pre-wrap;overflow-wrap:anywhere}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.tag{font-weight:600;color:var(--accent)}
.del{background:none;border:0;color:var(--danger);font:600 12.5px var(--body);cursor:pointer;padding:4px 6px}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;font:700 22px var(--display);color:var(--ink);margin-bottom:6px}
.more{display:block;margin:10px auto 0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:10px 18px;font:500 14px var(--body);cursor:pointer}

.dropov{position:fixed;inset:0;z-index:30;background:rgba(43,111,99,.25);display:grid;place-items:center;pointer-events:none}
.dropov div{background:var(--surface);border:3px dashed var(--accent);border-radius:20px;padding:28px 40px;font:800 22px var(--display)}
.lb{position:fixed;inset:0;z-index:40;background:rgba(6,9,8,.93);display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 56px) 12px calc(env(safe-area-inset-bottom,0px) + 16px)}
.lb img,.lb video{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
.lb .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;width:42px;height:42px;border-radius:50%;border:0;background:#fff;color:#111;font-size:24px;cursor:pointer}
.lb a{position:absolute;top:calc(env(safe-area-inset-top,0px) + 18px);left:14px;color:#fff;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;max-width:calc(100% - 32px);text-align:center}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>DR.NORA Appartment</h1>
      <p class="sub">Photos, videos and links for every part of the apartment. Anyone with this link can add and see everything.</p>
    </div>
    <button class="owner" id="ownerBtn" type="button">Owner</button>
  </header>

  <nav class="depts" id="depts" aria-label="Departments"></nav>

  <section class="add" aria-label="Add something">
    <div class="card">
      <div class="where" id="where"></div>
      <div class="btns">
        <button class="big p" id="pickBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-8 8"/></svg>
          Photo / Video
        </button>
        <button class="big s" id="linkBtn" type="button" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>
          Add a link
        </button>
      </div>
      <input type="file" id="fileIn" accept="image/*,video/*" multiple hidden>
      <form class="linkform" id="linkForm" hidden>
        <div class="row">
          <input id="linkUrl" type="url" inputmode="url" placeholder="Paste a link (https://…)" autocomplete="off" required>
          <button type="submit">Add</button>
        </div>
        <input id="linkNote" type="text" placeholder="Optional note" maxlength="300" autocomplete="off">
      </form>
      <p class="hint">On a computer you can also drag files here or paste with Ctrl/Cmd+V. Up to 50 MB per file.</p>
      <div class="queue" id="queue" aria-live="polite"></div>
      <div class="notice" id="notice" hidden></div>
    </div>
  </section>

  <div class="types" role="group" aria-label="Show">
    <button class="type" data-t="all" aria-pressed="true">All</button>
    <button class="type" data-t="image" aria-pressed="false">Photos</button>
    <button class="type" data-t="video" aria-pressed="false">Videos</button>
    <button class="type" data-t="link" aria-pressed="false">Links</button>
  </div>

  <div class="wall" id="wall"></div>
  <div class="empty" id="empty"><b>Loading…</b>Getting everything that's been shared.</div>
</div>

<div class="dropov" id="dropov" hidden><div>Drop to upload</div></div>
<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Preview">
  <button class="x" id="lbX" aria-label="Close">×</button>
  <div id="lbBody" style="display:contents"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<script>
/* ======================= CONFIG — edit here ======================= */
const CONFIG = {
  SUPABASE_URL: "https://mfttqrltennhwbzjlcyd.supabase.co",
  SUPABASE_ANON_KEY: "sb_publishable_qOKi5f_oyLiclwFU-XIrvQ_4ZGI76wx",
  BUCKET: "uploads",
  DEPARTMENTS: [
    "Living Right",
    "Living Left",
    "Reception (Open Area)",
    "Kitchen",
    "TV Stand",
    "Dining",
    "Master Bedroom",
    "1st Bedroom (Garden Side)",
    "2nd Bedroom (Family WR side)"
  ],
  MAX_MB: 50
};
/* ================================================================= */

(() => {
  const $ = id => document.getElementById(id);
  const MAX = CONFIG.MAX_MB * 1024 * 1024;
  const S = { items: [], dept: "all", type: "all", pin: null, shown: 60 };
  let sb = null;

  try { const d = localStorage.getItem("dn_dept"); if (d && CONFIG.DEPARTMENTS.includes(d)) S.dept = d; } catch {}
  try { S.pin = sessionStorage.getItem("dn_pin"); } catch {}
  // Delete keys for posts made on this device (lets people remove their own uploads)
  let MINE = {}; try { MINE = JSON.parse(localStorage.getItem("dn_mine")||"{}")||{}; } catch {}
  const saveMine = () => { try { localStorage.setItem("dn_mine", JSON.stringify(MINE)); } catch {} };
  const newToken = () => { const a=new Uint8Array(24); crypto.getRandomValues(a); return [...a].map(b=>b.toString(16).padStart(2,"0")).join(""); };
  async function createPost(fields){
    const token=newToken();
    const {data,error}=await sb.rpc("create_post",{p_kind:fields.kind,p_department:fields.department,p_file_path:fields.file_path||null,
      p_link_url:fields.link_url||null,p_note:fields.note||null,p_file_name:fields.file_name||null,p_token:token});
    if(error) throw error;
    const row=Array.isArray(data)?data[0]:data;
    MINE[row.id]=token; saveMine(); return row;
  }

  /* helpers */
  let tt; const toast = m => { const t=$("toast"); t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,3200); };
  const notice = (m,bad) => { const n=$("notice"); if(!m){n.hidden=true;return;} n.textContent=m; n.className="notice"+(bad?" bad":""); n.hidden=false; };
  const el = (tag,a={},kids=[]) => { const e=document.createElement(tag);
    for (const [k,v] of Object.entries(a)) { if(k==="text") e.textContent=v; else if(k.startsWith("on")) e.addEventListener(k.slice(2),v); else if(v!=null&&v!==false) e.setAttribute(k,v===true?"":v); }
    for (const k of [].concat(kids)) if (k) e.append(k); return e; };
  const normUrl = raw => { let u=(raw||"").trim(); if(!u) return null; if(!/^[a-z][a-z0-9+.-]*:/i.test(u)) u="https://"+u;
    try { const p=new URL(u); return (p.protocol==="http:"||p.protocol==="https:") && p.hostname.includes(".") ? p.href : null; } catch { return null; } };
  const ago = iso => { const t=new Date(iso).getTime(), s=Math.max(0,(Date.now()-t)/1000);
    if(s<60) return "just now"; if(s<3600) return Math.floor(s/60)+" min ago"; if(s<86400) return Math.floor(s/3600)+" h ago";
    if(s<604800) return Math.floor(s/86400)+" d ago"; return new Date(t).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}); };
  const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "general";
  const pubUrl = path => sb.storage.from(CONFIG.BUCKET).getPublicUrl(path).data.publicUrl;
  const currentAddDept = () => S.dept==="all" ? null : S.dept;

  /* departments UI — icon tiles */
  const ICONS = {
    all:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
    sofa:'<path d="M4 11V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3"/><path d="M2 13a2 2 0 0 1 4 0v2h12v-2a2 2 0 0 1 4 0v4H2z"/><path d="M5 17v2M19 17v2"/>',
    door:'<path d="M5 21V4a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v17"/><path d="M3 21h18"/><circle cx="15" cy="12" r="1"/>',
    kitchen:'<path d="M4 10h16v2a6 6 0 0 1-6 6h-4a6 6 0 0 1-6-6z"/><path d="M2 10h20"/><path d="M9 6c0-1 1-1 1-2M14 6c0-1 1-1 1-2"/><path d="M8 18l-1 3M16 18l1 3"/>',
    tv:'<rect x="2" y="5" width="20" height="13" rx="2"/><path d="M8 21h8M12 18v3"/><path d="M9 2l3 3 3-3"/>',
    dining:'<path d="M3 10h18"/><path d="M5 10v10M19 10v10"/><path d="M8 3v4a2 2 0 0 0 4 0V3M10 7v0"/><path d="M16 3c1.5 1 2 2.5 2 4h-2z"/>',
    bed:'<path d="M3 18V6"/><path d="M3 13h18v5"/><path d="M21 13v-2a3 3 0 0 0-3-3h-7v5"/><circle cx="7" cy="10" r="2"/><path d="M3 18h18"/>',
    bedGarden:'<path d="M3 19V9"/><path d="M3 15h14v4"/><path d="M3 19h14"/><circle cx="6.5" cy="12.5" r="1.5"/><path d="M19 21V11"/><path d="M19 13c-2 0-3-1.5-3-3.5 2 0 3 1.5 3 3.5zM19 11c0-2 1-3.5 3-3.5 0 2-1 3.5-3 3.5z"/>',
    bedFamily:'<path d="M3 19V9"/><path d="M3 15h18v4"/><path d="M3 19h18"/><circle cx="6.5" cy="12.5" r="1.5"/><path d="M15 3a2 2 0 1 1 0 .01M20 5a1.5 1.5 0 1 1 0 .01"/><path d="M13 10a2 2 0 0 1 4 0M18.5 10a1.5 1.5 0 0 1 3 0"/>'
  };
  function iconFor(d){
    const n=d.toLowerCase();
    const k = d==="all"?"all": n.includes("living")?"sofa": n.includes("reception")?"door": n.includes("kitchen")?"kitchen":
      n.includes("tv")?"tv": n.includes("dining")?"dining": n.includes("garden")?"bedGarden": n.includes("family")?"bedFamily":
      n.includes("bed")?"bed":"all";
    const s=document.createElementNS("http://www.w3.org/2000/svg","svg");
    s.setAttribute("viewBox","0 0 24 24"); s.setAttribute("fill","none"); s.setAttribute("stroke-width","1.7");
    s.setAttribute("stroke-linecap","round"); s.setAttribute("stroke-linejoin","round"); s.setAttribute("aria-hidden","true");
    s.innerHTML=ICONS[k]; return s;
  }
  function renderWhere(){
    const w=$("where"); w.textContent="";
    if(S.dept==="all"){ w.append("Tap a room above, then add photos, videos or links."); }
    else { w.append("Adding to ", el("b",{text:S.dept})); }
  }
  function renderDepts(){
    const nav=$("depts"); nav.textContent="";
    const count = d => S.items.filter(i=>d==="all"||i.department===d).length;
    const mk = (d,label) => el("button",{class:"dept",type:"button","aria-pressed":String(S.dept===d),title:label,onclick:()=>{
        S.dept=d; S.shown=60; try{localStorage.setItem("dn_dept",d);}catch{} render(); }},
      [iconFor(d), el("span",{text:label}), el("span",{class:"c",text:String(count(d))})]);
    nav.append(mk("all","All rooms"));
    CONFIG.DEPARTMENTS.forEach(d=>nav.append(mk(d,d)));
    // include any department that exists in data but was removed from the list
    [...new Set(S.items.map(i=>i.department).filter(d=>d&&!CONFIG.DEPARTMENTS.includes(d)))].forEach(d=>nav.append(mk(d,d)));
  }
  document.querySelectorAll(".type").forEach(b=>b.onclick=()=>{ S.type=b.dataset.t; S.shown=60;
    document.querySelectorAll(".type").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); render(); });

  /* wall */
  function render(){
    renderDepts(); renderWhere();
    const list=S.items.filter(i=>(S.dept==="all"||i.department===S.dept)&&(S.type==="all"||i.kind===S.type));
    const wall=$("wall"); wall.textContent="";
    list.slice(0,S.shown).forEach(i=>wall.append(card(i)));
    if(list.length>S.shown) wall.after(Object.assign(document.querySelector(".more")||el("button",{class:"more",type:"button"}),{textContent:"Show more",onclick:()=>{S.shown+=60;render();}}));
    else document.querySelector(".more")?.remove();
    const e=$("empty"); e.hidden=list.length>0;
    if(!list.length){ e.innerHTML=""; e.append(el("b",{text:"Nothing here yet"}),
      document.createTextNode(S.dept==="all"?"Tap Photo / Video or Add a link to share the first thing.":"Nothing in "+S.dept+" yet. Tap Photo / Video or Add a link to start.")); }
  }
  function card(i){
    const kids=[];
    if(i.kind==="link"){
      let host=""; try{host=new URL(i.link_url).hostname.replace(/^www\./,"");}catch{}
      kids.push(el("a",{class:"linkbox",href:i.link_url,target:"_blank",rel:"noopener noreferrer"},[
        el("span",{class:"fav",text:host[0]||"↗"}),
        el("span",{class:"lt"},[el("span",{class:"ld",text:host||i.link_url}),el("span",{class:"lu",text:i.link_url})])]));
    } else {
      const src=pubUrl(i.file_path);
      const b=el("button",{class:"media",type:"button","aria-label":"Open "+(i.kind==="image"?"photo":"video"),onclick:()=>openLb(i,src)});
      if(i.kind==="image"){ const im=el("img",{src,alt:i.note||i.file_name||"Photo",loading:"lazy"});
        im.onerror=()=>b.replaceWith(el("div",{class:"missing",text:"This photo can't be shown."})); b.append(im); }
      else { const v=el("video",{src:src+"#t=0.1",muted:true,playsinline:true,preload:"metadata"});
        v.onerror=()=>b.replaceWith(el("a",{class:"missing",href:src,target:"_blank",rel:"noopener",text:"Video can't play here — tap to open it"}));
        b.append(v, el("span",{class:"play"},[el("span",{},[Object.assign(document.createElementNS("http://www.w3.org/2000/svg","svg"),{innerHTML:'<path d="M8 5v14l11-7z"/>'})])]));
        b.querySelector("svg").setAttribute("viewBox","0 0 24 24"); }
      kids.push(b);
    }
    const meta=el("div",{class:"meta"});
    if(i.note) meta.append(el("div",{class:"note",text:i.note}));
    const foot=el("div",{class:"foot"},[el("span",{},[el("span",{class:"tag",text:i.department||"—"})," · "+ago(i.created_at)])]);
    const myTok=MINE[i.id];
    if(S.pin||myTok){ const d=el("button",{class:"del",type:"button",text:"Delete"}); let armed=false;
      d.onclick=async()=>{ if(!armed){armed=true;d.textContent="Tap again to delete";setTimeout(()=>{armed=false;d.textContent="Delete";},4000);return;}
        d.disabled=true; d.textContent="Deleting…";
        const {data,error}= myTok ? await sb.rpc("delete_own_post",{p_id:i.id,p_token:myTok}) : await sb.rpc("delete_post",{p_id:i.id,p_pin:S.pin});
        if(error||data!==true){ d.disabled=false; d.textContent="Delete"; toast(error?"Couldn't delete — try again":(myTok?"Couldn't delete this post":"Wrong owner PIN"));
          if(!myTok&&data===false){S.pin=null;try{sessionStorage.removeItem("dn_pin");}catch{} ownerUI(); render();} return; }
        delete MINE[i.id]; saveMine();
        S.items=S.items.filter(x=>x.id!==i.id); render(); toast("Deleted"); };
      foot.append(d); }
    meta.append(foot); kids.push(meta);
    return el("article",{class:"item"},kids);
  }
  function openLb(i,src){ const b=$("lbBody"); b.textContent="";
    b.append(i.kind==="image"?el("img",{src,alt:i.note||"Photo"}):el("video",{src,controls:true,autoplay:true,playsinline:true}),
             el("a",{href:src,target:"_blank",rel:"noopener",text:"Open full size ↗"}));
    $("lb").hidden=false; $("lbX").focus(); }
  const closeLb=()=>{ $("lb").hidden=true; $("lbBody").textContent=""; };
  $("lbX").onclick=closeLb; $("lb").onclick=e=>{ if(e.target.id==="lb") closeLb(); };
  addEventListener("keydown",e=>{ if(e.key==="Escape"&&!$("lb").hidden) closeLb(); });

  /* owner */
  function ownerUI(){ const b=$("ownerBtn"); b.classList.toggle("on",!!S.pin); b.textContent=S.pin?"Owner ✓ (tap to sign out)":"Owner"; }
  $("ownerBtn").onclick=()=>{
    if(S.pin){ S.pin=null; try{sessionStorage.removeItem("dn_pin");}catch{} ownerUI(); render(); return; }
    const f=el("form",{class:"row"},[el("input",{type:"text",id:"pinIn",placeholder:"Owner PIN",autocomplete:"off",inputmode:"text"}),el("button",{type:"submit",text:"OK"})]);
    f.onsubmit=e=>{ e.preventDefault(); const v=$("pinIn").value.trim(); if(!v) return; S.pin=v; try{sessionStorage.setItem("dn_pin",v);}catch{} f.remove(); ownerUI(); render(); toast("Owner mode on — Delete buttons are showing"); };
    const n=$("notice"); n.hidden=false; n.className="notice"; n.textContent="Enter your owner PIN to delete posts:"; n.append(f); $("pinIn").focus();
  };

  /* adding */
  function qRow(name){ const s=el("span",{class:"s",text:"Uploading…"}), sp=el("span",{class:"spin"});
    const r=el("div",{class:"qi"},[sp,el("span",{class:"n",text:name}),s]); $("queue").prepend(r);
    return { ok(){r.classList.add("ok");sp.remove();s.textContent="Added";setTimeout(()=>r.remove(),2500);},
             err(m){r.classList.add("err");sp.remove();s.textContent=m;setTimeout(()=>r.remove(),9000);} }; }
  async function toJpeg(file,maxSide=3200,q=.86){ const u=URL.createObjectURL(file);
    try{ const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=u;});
      const k=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight)); const c=document.createElement("canvas");
      c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      return await new Promise(r=>c.toBlob(r,"image/jpeg",q)); } catch { return null; } finally { URL.revokeObjectURL(u); } }

  async function uploadFile(f){
    const dept=currentAddDept(); const r=qRow((f.name||"file")+" → "+dept);
    try{
      const isVid=(f.type||"").startsWith("video/")||/\.(mp4|mov|m4v|webm|3gp)$/i.test(f.name||"");
      let blob=f, type=f.type||(isVid?"video/mp4":"image/jpeg"), ext=((f.name||"").split(".").pop()||"").toLowerCase();
      if(!isVid){ const okT=["image/jpeg","image/png","image/gif","image/webp"];
        if(!okT.includes(f.type)||f.size>MAX){ const j=await toJpeg(f); if(j){blob=j;type="image/jpeg";ext="jpg";} } }
      if(blob.size>MAX){ r.err("Too big (max "+CONFIG.MAX_MB+" MB)"); return; }
      if(!/^[a-z0-9]{2,5}$/.test(ext)) ext=isVid?"mp4":"jpg";
      const path=slug(dept)+"/"+Date.now()+"-"+Math.random().toString(36).slice(2,8)+"."+ext;
      const up=await sb.storage.from(CONFIG.BUCKET).upload(path,blob,{contentType:type,upsert:false});
      if(up.error) throw up.error;
      const row=await createPost({kind:isVid?"video":"image",file_path:path,file_name:(f.name||"").slice(0,200),department:dept});
      addItem(row); r.ok();
    }catch(e){ const m=String(e&&(e.message||e.error)||""); r.err(/size|large|exceed/i.test(m)?"Too big (max "+CONFIG.MAX_MB+" MB)":/mime|type/i.test(m)?"File type not allowed":"Upload failed — try again"); console.error(e); }
  }
  const needRoom=()=>{ if(S.dept!=="all") return false; toast("Tap a room first, then add"); $("depts").scrollIntoView({behavior:"smooth",block:"start"}); return true; };
  const handleFiles=list=>{ if(!sb) return toast("Not connected yet"); if(needRoom()) return; [...list].forEach(uploadFile); };

  async function addLink(raw,note){
    if(needRoom()) return false;
    const url=normUrl(raw); if(!url){ toast("That doesn't look like a web link"); return false; }
    let data; try { data=await createPost({kind:"link",link_url:url,note:(note||"").trim().slice(0,300)||null,department:currentAddDept()}); }
    catch(error){ toast("Couldn't add the link — try again"); console.error(error); return false; }
    addItem(data); toast("Link added to "+data.department); return true;
  }
  function addItem(row){ if(!S.items.some(x=>x.id===row.id)){ S.items.unshift(row); S.items.sort((a,b)=>b.created_at.localeCompare(a.created_at)); render(); } }

  $("pickBtn").onclick=()=>{ if(needRoom()) return; $("fileIn").click(); };
  $("fileIn").onchange=e=>{ handleFiles(e.target.files); e.target.value=""; };
  $("linkBtn").onclick=()=>{ if(needRoom()) return; const f=$("linkForm"); f.hidden=!f.hidden; $("linkBtn").setAttribute("aria-expanded",String(!f.hidden)); if(!f.hidden) $("linkUrl").focus(); };
  $("linkForm").onsubmit=async e=>{ e.preventDefault(); if(await addLink($("linkUrl").value,$("linkNote").value)){ $("linkUrl").value=""; $("linkNote").value=""; } };
  addEventListener("paste",e=>{ if(/INPUT|TEXTAREA/.test(e.target.tagName)) return;
    const fs=[...(e.clipboardData?.files||[])]; if(fs.length){ e.preventDefault(); handleFiles(fs); return; }
    const t=e.clipboardData?.getData("text")||""; if(normUrl(t)){ e.preventDefault(); addLink(t,""); } });
  let dn=0;
  addEventListener("dragenter",e=>{ if([...(e.dataTransfer?.types||[])].includes("Files")){dn++;$("dropov").hidden=false;} });
  addEventListener("dragleave",()=>{ dn=Math.max(0,dn-1); if(!dn) $("dropov").hidden=true; });
  addEventListener("dragover",e=>e.preventDefault());
  addEventListener("drop",e=>{ e.preventDefault(); dn=0; $("dropov").hidden=true;
    if(e.dataTransfer?.files?.length) handleFiles(e.dataTransfer.files);
    else { const u=(e.dataTransfer?.getData("text/uri-list")||e.dataTransfer?.getData("text")||"").split("\n")[0]; if(u) addLink(u,""); } });
  setInterval(()=>S.items.length&&render(),60000);

  /* boot */
  ownerUI();
  if(!window.supabase||CONFIG.SUPABASE_URL.startsWith("__")){ notice("This site isn't connected to its storage yet.",true); $("pickBtn").disabled=$("linkBtn").disabled=true; render(); return; }
  sb=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY,{auth:{persistSession:false}});
  (async()=>{
    const {data,error}=await sb.from("posts").select("*").order("created_at",{ascending:false}).limit(2000);
    if(error){ notice("Couldn't load the wall. Check your connection and refresh.",true); console.error(error); return; }
    S.items=data||[]; render();
    sb.channel("posts-live")
      .on("postgres_changes",{event:"INSERT",schema:"public",table:"posts"},p=>addItem(p.new))
      .on("postgres_changes",{event:"DELETE",schema:"public",table:"posts"},p=>{ S.items=S.items.filter(x=>x.id!==p.old.id); render(); })
      .subscribe();
  })();
})();
</script>
</body>
</html>
